# ════════════════════════════════════════════════════════════
#  PidLane APK-build workflow
#  Bijgewerkt: 2026-08-28 (CET)
#  Wijziging: Capacitor 8 (targetSdk 36) i.p.v. Capacitor 6 (targetSdk 34),
#             plus een harde controle op het API-niveau. Play weigert per
#             31-08-2026 elke inzending onder API 36; die grens werd hier
#             nergens bewaakt, dus je zou het pas bij de upload merken.
#             LET OP de vorm: het API-niveau wordt NIET geinjecteerd. Het
#             komt uit het Capacitor-template en wordt alleen GECONTROLEERD
#             tegen PLAY_MIN_TARGET_SDK hieronder. Injecteren zou een tweede
#             waarheid maken naast package.json, en dan is bij de volgende
#             verhoging niet meer te zien welke van de twee wint.
#             Ophogen doe je dus in package.json (Capacitor-versie) en in
#             PLAY_MIN_TARGET_SDK — niet in een gradle-bestand.
#             Ook: Java 17 -> 21, vereist door AGP 8.13 / Capacitor 8.
#  Eerder:    naast de debug-APK nu ook een RELEASE-BUNDLE (.aab). De
#             Play Store neemt sinds 2021 geen losse APK meer aan voor
#             nieuwe inzendingen; zonder .aab kom je niet eens aan de
#             review toe. Ongetekend — ondertekenen doe je met een
#             keystore die NIET in de repo hoort.
#             Ook: versionCode/versionName uit package.json, en de
#             permissiecontrole faalt nu hard i.p.v. door te bouwen.
#  Eerder:    app-icoon komt van het ECHTE logo (icon-512.png in de
#             repo) i.p.v. de nagetekende SVG — die was "net wat anders".
#             SVG blijft als vangnet zodat de build nooit breekt.
#  Eerder:    CAMERA-permissie + camera-feature toegevoegd aan de
#             permissie-injectie (QR-scanner local ↔ expert).
#  Eerder:    src/ verwijderd. App = root/index.html (live via Pages).
#             webDir = www (stub, hieronder aangemaakt). Trigger op root.
# ════════════════════════════════════════════════════════════
name: Build PidLane APK

on:
  push:
    branches: [main]
    paths:
     - 'public/index.html'
     - 'public/privacy.html'
     - 'public/config.js'
     - 'package.json'
     - 'capacitor.config.json'
     # ALLE DRIE de plekken waar de stap "App-icoon" hieronder zoekt, en dat
     # is geen slordigheid maar een koppeling. Hier stond tot 03-09-2026
     # alleen 'icon-512.png' (de wortel), terwijl het bestand in public/
     # staat. De build vond hem wel — de `ls` daar valt terug op public/ —
     # maar een gewijzigd icoon startte geen build. Je zag dus een groene
     # historie en een APK met het oude logo, en niets dat daarover klaagde.
     # public/test-icoonpad.js bewaakt dat deze lijst de zoeklijst dekt.
     - 'icon-512.png'
     - 'public/icon-512.png'
     - 'icon-1024.png'
     - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# Annuleer lopende builds als er een nieuwe push komt — voorkomt 4x builden
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Europe/Amsterdam
  # Het laagste API-niveau dat de Play Store nog aanneemt. Per 31-08-2026: 36.
  # Google verlegt deze grens jaarlijks rond eind augustus. Verhoog hier het
  # getal EN in package.json de Capacitor-versie die dat niveau meebrengt;
  # de stap "Controleer target API-niveau" zegt dan meteen of dat klopt.
  #   Capacitor 6 -> 34    Capacitor 7 -> 35    Capacitor 8 -> 36
  PLAY_MIN_TARGET_SDK: 36

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set timezone to Europe/Amsterdam
        run: |
          sudo timedatectl set-timezone Europe/Amsterdam || sudo ln -sf /usr/share/zoneinfo/Europe/Amsterdam /etc/localtime
          echo "Runner-tijd is nu: $(date)"

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create www stub (webDir)
        run: |
          # De echte app laadt live via server.url (app.pidlane.nl, Cloudflare).
          # Capacitor heeft alleen een bestaande webDir nodig om te kunnen syncen.
          #
          # TWEE bestanden, en het tweede is er voor de reviewer.
          #
          # index.html  — de schil laadt hem nooit zolang server.url antwoordt.
          # error.html  — WEL, en dat is het punt. Capacitor laadt server.errorPath
          #               uit de lokale webDir zodra de hoofdpagina niet komt: geen
          #               netwerk, DNS stuk, of app.pidlane.nl plat. Zonder die
          #               pagina ziet de gebruiker de kale WebView-fout
          #               ("net::ERR_NAME_NOT_RESOLVED" op een wit vlak), en dat
          #               leest als een kapotte app in plaats van als een
          #               ontbrekende verbinding. Voor een Play-reviewer op een
          #               haperend gastnetwerk is dat het verschil tussen
          #               "werkt niet" en "ik zet mijn wifi aan".
          #
          # De naam error.html staat OOK in capacitor.config.json (server.errorPath).
          # Dat zijn twee plekken, en daarom bewaakt public/test-foutpagina.js dat
          # ze hetzelfde zeggen — anders bouwt dit stilzwijgend een schil met een
          # errorPath die nergens heen wijst, en valt de gebruiker alsnog op de
          # kale WebView-fout terug.
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!doctype html><html lang="nl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>PidLane</title></head>
          <body style="background:#0D1117;color:#fff;font-family:sans-serif;text-align:center;padding-top:40vh">
          PidLane laadt…</body></html>
          HTML
          cat > www/error.html <<'HTML'
          <!doctype html>
          <html lang="nl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Geen verbinding — PidLane</title>
          <style>
            :root{color-scheme:dark}
            body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
                 background:#0D1117;color:#e6edf3;
                 font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
                 padding:24px env(safe-area-inset-right) 24px env(safe-area-inset-left);box-sizing:border-box}
            main{max-width:400px;text-align:center}
            h1{font-size:20px;margin:0 0 10px;color:#fff}
            p{color:#c9d1d9;margin:0 0 14px}
            .k{background:#161b22;border:1px solid #21262d;border-radius:10px;
               padding:12px 14px;margin:18px 0;text-align:left;font-size:13.5px;color:#8b949e}
            ul{margin:6px 0 0;padding-left:18px}
            li{margin-bottom:5px}
            button{background:#1f6feb;color:#fff;border:0;border-radius:9px;
                   padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
          </style></head>
          <body><main>
            <h1>Geen verbinding</h1>
            <p>PidLane kon zichzelf niet laden. De app haalt zijn schermen van
               <strong>app.pidlane.nl</strong>, en dat lukt nu niet.</p>
            <div class="k">Probeer dit:
              <ul>
                <li>Zet wifi of mobiel internet aan.</li>
                <li>Staat de vliegtuigmodus uit?</li>
                <li>Op een gastnetwerk: is de inlogpagina al langsgekomen?</li>
              </ul>
            </div>
            <p style="font-size:13px;color:#8b949e">Verbinden met de OBD2-adapter gaat
               via Bluetooth en heeft geen internet nodig — het laden van de app zelf wel.</p>
            <button onclick="location.reload()">Opnieuw proberen</button>
          </main></body></html>
          HTML
          echo "www/index.html en www/error.html aangemaakt"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v4.7.0
        with:
          # Capacitor 8 draait op AGP 8.13 / Gradle 8.14.3 en wil Java 21.
          # Op 17 faalt de build in Gradle met een melding over class file
          # versions die nergens naar de JDK-keuze wijst.
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android || echo "Already added"

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Controleer target API-niveau
        run: |
          # WAAROM DIT HIER STAAT EN NIETS INJECTEERT
          # android/ wordt elke build opnieuw gegenereerd uit het template van
          # de Capacitor-versie in package.json. Dat template bepaalt het API-
          # niveau. Deze stap schrijft dat niet over maar LEEST het en vergelijkt
          # het met wat de Play Store eist.
          #
          # Het alternatief - targetSdkVersion hier inspuiten - werkt ook, maar
          # dan staat het getal op twee plekken en gaat compileSdk er niet
          # vanzelf in mee. Een targetSdk boven de compileSdk bouwt bovendien
          # niet. Liever een build die zegt "jouw Capacitor-versie is te oud"
          # dan een build die stilzwijgend iets samenstelt wat Play weigert.
          python3 - <<'PY'
          import os, re, sys, pathlib

          eis = int(os.environ["PLAY_MIN_TARGET_SDK"])
          p = pathlib.Path("android/variables.gradle")
          if not p.exists():
              print("FOUT: android/variables.gradle bestaat niet — is cap add android gelukt?")
              sys.exit(1)
          g = p.read_text()
          print("── variables.gradle ──")
          print(g)

          def lees(naam):
              m = re.search(naam + r"\s*=\s*(\d+)", g)
              if not m:
                  print("FOUT: %s niet gevonden in variables.gradle" % naam); sys.exit(1)
              return int(m.group(1))

          target  = lees("targetSdkVersion")
          compile_ = lees("compileSdkVersion")
          minsdk  = lees("minSdkVersion")

          if target < eis:
              print("FOUT: targetSdkVersion is %d, de Play Store eist minimaal %d." % (target, eis))
              print("      Dit getal komt uit het Capacitor-template, niet uit deze workflow.")
              print("      Verhoog de Capacitor-versie in package.json:")
              print("        Capacitor 6 -> 34    Capacitor 7 -> 35    Capacitor 8 -> 36")
              print("      Een .aab onder de eis wordt bij de upload geweigerd, met een")
              print("      melding die nergens naar de oorzaak wijst. Daarom hier stoppen.")
              sys.exit(1)

          # compileSdk lager dan targetSdk bouwt niet. Als dat ooit gebeurt is er
          # met de hand aan een gradle-bestand gezeten, en dat is precies wat deze
          # opzet wil voorkomen.
          if compile_ < target:
              print("FOUT: compileSdkVersion (%d) ligt onder targetSdkVersion (%d)" % (compile_, target))
              sys.exit(1)

          print("OK: targetSdk %d, compileSdk %d, minSdk %d — Play eist %d" %
                (target, compile_, minsdk, eis))
          PY

      - name: Add Bluetooth + Camera permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()

          print("── Manifest VOOR injectie ──")
          print(xml)

          # 1. Verwijder bestaande (mogelijk verkeerde) BT/locatie/camera-permissies
          xml = re.sub(
              r'\s*<uses-permission[^>]*android\.permission\.'
              r'(BLUETOOTH[A-Z_]*|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA)[^>]*/>',
              '', xml)
          xml = re.sub(
              r'\s*<uses-feature[^>]*android\.hardware\.(bluetooth[a-z_]*|camera[a-z_.]*)[^>]*/>',
              '', xml)
          xml = re.sub(r'\s*<!-- PidLane (BT|BT\+camera) permissies.*?-->', '', xml)

          # 2. De correcte permissie-set
          #    CAMERA: voor de in-app QR-scanner (getUserMedia in de WebView)
          #    bij het koppelen local ↔ expert. uses-feature required=false
          #    zodat de app ook installeert op toestellen zonder camera —
          #    QR-scannen is optioneel, de link-/codeflow werkt altijd.
          perms = (
              '\n    <!-- PidLane BT+camera permissies (geinjecteerd door CI) -->'
              '\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />'
              '\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'
              '\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />'
              '\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />'
              # LOCATIE — keuze a) is op 21-08-2026 gemaakt: GEEN locatie.
              #
              # Voor Bluetooth is locatie niet nodig op Android 12+: daar doet
              # BLUETOOTH_SCAN met neverForLocation het werk. Op Android 11 en
              # ouder eist het systeem ACCESS_FINE_LOCATION om te mogen scannen,
              # en daar is @ascentio-it/capacitor-bluetooth-serial van afhankelijk.
              # Vandaar dat de permissie blijft staan MET maxSdkVersion=30: hij
              # geldt alleen op API 30 en lager, en verschijnt op moderne
              # toestellen niet eens in de permissielijst.
              #
              # Wat er wél veranderd is: de app leest zelf geen locatie meer.
              # pidlane-gps.js is verwijderd en de bulk-recorder neemt geen
              # positie meer op. Die functie was op Android 12+ toch al stil
              # kapot (permissie tot API 30, dus watchPosition kreeg nooit een
              # fix) en kostte in ruil een sensitive permission met eigen
              # disclosure en een Data safety-verklaring.
              #
              # Gevolg voor de Play Store: locatie hoeft NIET in de Data
              # safety-form als gedeeld of verzameld gegeven. Komt er ooit
              # geolocation-code terug in de app, dan klopt die verklaring niet
              # meer — test-geen-gps.js bewaakt dat, en de controle hieronder
              # faalt als de permissie zonder maxSdkVersion in het manifest komt.
              '\n    <uses-permission android:name="android.permission.CAMERA" />'
              '\n    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />'
              '\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />'
              '\n    <uses-feature android:name="android.hardware.camera" android:required="false" />'
              '\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
          )

          # 3. Injecteer direct na de <manifest ...> open-tag
          m = re.search(r'<manifest\b[^>]*>', xml)
          if not m:
              print("FOUT: <manifest> tag niet gevonden")
              sys.exit(1)
          xml = xml[:m.end()] + perms + xml[m.end():]

          path.write_text(xml)

          print("── Manifest NA injectie ──")
          print(xml)

          # Harde controles. Een build die doorloopt met een halve permissieset
          # levert een APK op die het pas in de auto laat afweten — of pas bij
          # de review. Beide keren duurder dan hier stoppen.
          moet = [
              ('BLUETOOTH_SCAN', 'scannen naar de adapter'),
              ('neverForLocation', 'verklaring dat scan niet voor plaatsbepaling is'),
              ('BLUETOOTH_CONNECT', 'praten met een gekoppelde adapter'),
              ('android.hardware.bluetooth_le', 'BLE-feature (required=false)'),
          ]
          for naam, waarvoor in moet:
              if naam not in xml:
                  print("FOUT: %s ontbreekt (%s)" % (naam, waarvoor)); sys.exit(1)

          # Mag er NIET in: achtergrondlocatie. Die vraagt een aparte
          # Play-verklaring met video-onderbouwing, en de app gebruikt hem niet.
          # Als een plugin hem ooit meesmokkelt via manifest-merge wil je dat
          # hier zien en niet in de reviewmail.
          for verboden in ('ACCESS_BACKGROUND_LOCATION', 'READ_PHONE_STATE',
                           'QUERY_ALL_PACKAGES', 'REQUEST_INSTALL_PACKAGES'):
              if verboden in xml:
                  print("FOUT: %s staat in het manifest en hoort er niet in" % verboden); sys.exit(1)

          # Locatie mag alleen bestaan als legacy-BT-permissie, dus uitsluitend
          # met maxSdkVersion=30. Zonder die grens is het een sensitive
          # permission die om een eigen disclosure en een Data safety-verklaring
          # vraagt — en de app leest sinds 21-08 helemaal geen locatie meer.
          import re as _re
          for _p in ('ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION'):
              for _m in _re.finditer(r'<uses-permission[^>]*' + _p + r'[^>]*/>', xml):
                  if 'maxSdkVersion="30"' not in _m.group(0):
                      print("FOUT: %s zonder maxSdkVersion=30 — dat is een sensitive permission" % _p)
                      print("      gevonden: %s" % _m.group(0)); sys.exit(1)

          if 'android.permission.CAMERA' not in xml:
              print("FOUT: CAMERA-permissie-injectie mislukt")
              sys.exit(1)
          print("OK: permissieset compleet, niets verbodens gevonden")
          PY

      - name: Generate app icons from PidLane logo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick
          # ── Bron: het ECHTE PidLane-logo uit de repo (naast index.html).
          #    512px volstaat: grootste mipmap is 432px. Vangnet: nagetekende
          #    SVG, zodat de build nooit faalt als het bestand ontbreekt.
          ICON=$(ls icon-512.png public/icon-512.png icon-1024.png 2>/dev/null | head -1)
          if [ -n "$ICON" ]; then
            echo "Echt logo gevonden: $ICON"
            cp "$ICON" /tmp/icon_src.png
          else
            echo "WAARSCHUWING: icon-512.png niet gevonden in repo — vangnet-SVG gebruikt (icoon wijkt af van het echte logo!)"
            cat > /tmp/pidlane_icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#00FF88"/>
                <stop offset="1" stop-color="#00D4FF"/>
              </linearGradient>
            </defs>
            <rect width="128" height="128" rx="28" fill="#0D1117"/>
            <rect x="22" y="24" width="84" height="56" rx="16" fill="none" stroke="url(#g)" stroke-width="8"/>
            <path d="M 34 52 L 50 52 L 58 36 L 70 66 L 78 52 L 94 52"
                  fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="64" y1="90" x2="64" y2="104" stroke="#00FF88" stroke-width="8" stroke-linecap="round"/>
          </svg>
          SVG
            rsvg-convert -w 1024 -h 1024 /tmp/pidlane_icon.svg -o /tmp/icon_src.png
          fi
          RES="android/app/src/main/res"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="$RES/mipmap-${d%%:*}"; size="${d##*:}"; mkdir -p "$dir"
            convert /tmp/icon_src.png -resize ${size}x${size} "$dir/ic_launcher.png"
            # Ronde variant: cirkelmasker zodat ronde launchers geen hoeken tonen
            convert /tmp/icon_src.png -resize ${size}x${size} \
              \( +clone -alpha extract -fill black -colorize 100 -fill white \
                 -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) \
              -alpha off -compose CopyOpacity -composite "$dir/ic_launcher_round.png"
          done
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            dir="$RES/mipmap-${d%%:*}"; size="${d##*:}"; inner=$(( size * 64 / 100 ))
            convert /tmp/icon_src.png -resize ${inner}x${inner} -background none \
              -gravity center -extent ${size}x${size} "$dir/ic_launcher_foreground.png"
          done
          BG="$RES/values/ic_launcher_background.xml"
          if [ -f "$BG" ]; then
            sed -i 's|<color name="ic_launcher_background">[^<]*</color>|<color name="ic_launcher_background">#0F141A</color>|' "$BG"
          else
            mkdir -p "$RES/values"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0F141A</color>\n</resources>\n' > "$BG"
          fi
          echo "App-iconen gegenereerd:"
          ls -la $RES/mipmap-xxxhdpi/

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set versionCode and versionName
        run: |
          # versionName komt uit package.json zodat er één plek is waar het
          # staat. versionCode is het buildnummer: Play eist dat die bij elke
          # inzending OPLOOPT, en run_number doet dat vanzelf. Zet je hem ooit
          # handmatig lager, dan weigert Play de upload zonder nuttige melding.
          VN=$(node -p "require('./package.json').version")
          VC=${{ github.run_number }}

          # Het versienummer staat óók in public/config.js, want dat is wat de
          # gebruiker in het loginscherm ziet en wat in elk log en rapport
          # meegaat. Die twee liepen acht minor-versies uit elkaar (2.1.0 tegen
          # 2.9.0): een gebruiker meldde dan een bug op "2.9.0" terwijl de APK
          # op zijn toestel 2.1.0 heette. Hier hard falen is goedkoper dan dat
          # achteraf uitzoeken.
          AV=$(node -p "(require('fs').readFileSync('public/config.js','utf8').match(/const APP_VERSION\s*=\s*'([^']+)'/)||[])[1]||''")
          if [ "$VN" != "$AV" ]; then
            echo "FOUT: package.json zegt $VN, public/config.js zegt $AV"
            echo "      Zet ze gelijk voor je pusht — test-versie.js bewaakt dit ook."
            exit 1
          fi
          echo "versionName=$VN (gelijk aan APP_VERSION) versionCode=$VC"
          python3 - "$VN" "$VC" <<'PY'
          import re, sys, pathlib
          vn, vc = sys.argv[1], sys.argv[2]
          p = pathlib.Path("android/app/build.gradle")
          g = p.read_text()
          g = re.sub(r'versionCode\s+\d+',      'versionCode ' + vc, g, count=1)
          g = re.sub(r'versionName\s+"[^"]*"',  'versionName "' + vn + '"', g, count=1)
          p.write_text(g)
          if ('versionCode ' + vc) not in g or ('versionName "' + vn + '"') not in g:
              print("FOUT: versie niet gezet in build.gradle"); sys.exit(1)
          print("OK: versionCode", vc, "versionName", vn)
          PY

      - name: Prepare signing (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Geen keystore ingesteld? Dan bouwt alles gewoon door en levert de
          # workflow een ONGETEKENDE .aab op. Bewust geen harde fout: de debug-
          # APK is het dagelijkse werkpaard en die mag niet stukgaan omdat de
          # Play Store-route nog niet af is.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "getekend=nee" >> $GITHUB_OUTPUT
            echo "Geen KEYSTORE_BASE64 secret — release bundle wordt niet ondertekend."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
          # Controleren dat het echt een keystore is. Een verminkte base64 geeft
          # anders pas een fout diep in Gradle, met een melding die nergens naar
          # de secret wijst.
          if ! keytool -list -keystore $RUNNER_TEMP/upload.jks \
                 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "FOUT: keystore niet leesbaar. Controleer KEYSTORE_BASE64 en KEYSTORE_PASSWORD."
            exit 1
          fi
          # De private key er ook echt uit halen. De controle hierboven zegt
          # alleen dat de STORE opengaat; Gradle heeft daarna het KEY-wachtwoord
          # nodig en dat kan een andere zijn. Op 20-08 kostte dat drie minuten
          # bouwen voor een fout die hier in twintig seconden zichtbaar is.
          #
          # Let op bij PKCS12 (de standaard van moderne keytool): dat formaat
          # kent geen apart key-wachtwoord — store en key zijn daar altijd
          # gelijk. Vul KEY_PASSWORD dan met dezelfde waarde als KEYSTORE_PASSWORD.
          if ! keytool -certreq -keystore $RUNNER_TEMP/upload.jks \
                 -alias "${{ secrets.KEY_ALIAS }}" \
                 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                 -keypass "${{ secrets.KEY_PASSWORD }}" >/dev/null 2>&1; then
            echo "FOUT: sleutel niet uitleesbaar. Controleer KEY_ALIAS en KEY_PASSWORD."
            echo "Bij een PKCS12-keystore moet KEY_PASSWORD gelijk zijn aan KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "getekend=ja" >> $GITHUB_OUTPUT
          echo "Keystore geladen, sleutel uitleesbaar."

      - name: Inject signing config
        if: steps.signing.outputs.getekend == 'ja'
        run: |
          # De android/-map is net gegenereerd door `cap add android`, dus de
          # signingConfig moet er hier in — net als de permissies hierboven.
          # Wachtwoorden komen uit de omgeving, niet uit een keystore.properties:
          # zo'n bestand blijft achter in de workspace en kan in een artefact
          # belanden.
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path("android/app/build.gradle")
          g = p.read_text()
          if "signingConfigs" in g:
              print("signingConfigs bestaat al - niets gedaan"); sys.exit(0)
          if "buildTypes {" not in g:
              print("FOUT: buildTypes niet gevonden in build.gradle"); sys.exit(1)
          # LET OP de if-guard. Gradle evalueert dit hele bestand ook bij
          # assembleDebug, en daar staan de PL_-variabelen niet. Zonder guard
          # wordt het file(null) en faalt de DEBUG-build op regel 22 met
          # "path may not be null or empty string" - een fout die niets met
          # debug te maken lijkt te hebben. Gebeurd op 20-08.
          regels = [
              "",
              "    signingConfigs {",
              "        release {",
              '            if (System.getenv("PL_KEYSTORE")) {',
              '                storeFile file(System.getenv("PL_KEYSTORE"))',
              '                storePassword System.getenv("PL_STORE_PASS")',
              '                keyAlias System.getenv("PL_KEY_ALIAS")',
              '                keyPassword System.getenv("PL_KEY_PASS")',
              "            }",
              "        }",
              "    }",
              "",
          ]
          blok = "\n".join(regels)
          g = g.replace("    buildTypes {", blok + "    buildTypes {", 1)
          g = re.sub(r"(buildTypes \{\s*\n\s*release \{)",
                     r"\1\n            signingConfig signingConfigs.release", g, count=1)
          if "signingConfig signingConfigs.release" not in g:
              print("FOUT: release-buildType niet aan de signingConfig gekoppeld"); sys.exit(1)
          p.write_text(g)
          print("OK: signingConfig toegevoegd")
          PY

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Build release bundle (.aab)
        env:
          PL_KEYSTORE: ${{ runner.temp }}/upload.jks
          PL_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          PL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PL_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Verify signature
        if: steps.signing.outputs.getekend == 'ja'
        run: |
          # Gradle tekent stil door met een lege signingConfig als een van de
          # omgevingsvariabelen ontbreekt — dan krijg je een .aab die er goed
          # uitziet en pas bij de upload naar Play wordt geweigerd.
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|EC|DSA)"; then
            echo "Bundle is ondertekend."
          else
            echo "FOUT: bundle bevat geen handtekening."; exit 1
          fi

      - name: Remove keystore
        if: always()
        run: rm -f $RUNNER_TEMP/upload.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PidLane-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PidLane-release-aab
          # Ondertekend als de vier KEYSTORE-secrets zijn ingesteld, anders
          # niet — de stap "Prepare signing" zegt in het logboek welke van de
          # twee het geworden is. Zie ANDROID-PLAYSTORE.md.
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

name = "pidlane-proxy"
main = "worker.js"
compatibility_date = "2026-07-24"

# ── R2-bucket voor de APK en version.json ──
# Wordt in worker.js aangesproken als env.FILES (handleApkDownload, handleVersionJson).
# De bucket zelf moet al bestaan (Dashboard → R2 → pidlane-files aanmaken, of
# eenmalig via `wrangler r2 bucket create pidlane-files` als je ooit lokaal wrangler hebt).
[[r2_buckets]]
binding = "FILES"
bucket_name = "pidlane-files"

# ── Durable Object voor remote-sessies (expert-koppeling, pairing, codes) ──
# Wordt aangesproken als env.REMOTE_SESSION; class zit in hetzelfde worker.js-bestand.
[[durable_objects.bindings]]
name = "REMOTE_SESSION"
class_name = "RemoteSessionDO"

# Eerste migratie voor een gloednieuwe class. BELANGRIJK: sinds 9 juli 2026 staat
# Cloudflare geen NIEUWE key-value-backed DO-namespaces meer toe — voor een verse
# setup moet dit altijd new_sqlite_classes zijn, nooit new_classes. Dit is
# vermoedelijk waar het eerder misging als de oude/standaard flow new_classes
# gebruikte.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteSessionDO"]

# ── Optionele vars ──
# Alles hieronder heeft al een werkende fallback in de code (zie DEFAULTS en de
# losse Number()-checks in worker.js). Alleen invullen als je een waarde wil
# overschrijven — anders gewoon weglaten.
# [vars]
# ALLOW_LEGACY_APP_TOKEN = "false"
# TOKEN_TTL_HOURS = "12"
# PBKDF2_ITERS = "120000"

# ── Wat hier NIET in staat, met opzet ──
# - Secrets (AIRTABLE_TOKEN, ADMIN_TOKEN, SESSION_SECRET, USERS_JSON,
#   ANTHROPIC_API_KEY, evt. APP_TOKEN): die horen nooit in dit bestand. Zet ze
#   via Dashboard → Worker → Settings → Variables and Secrets → toevoegen als
#   "Secret" (niet als gewone var). Bij een git-gekoppelde Workers Build kan dat
#   niet via de CLI vanaf je werklaptop, dus dit moet via het dashboard.
# - Het custom domain app.pidlane.nl: dat regel je apart via Dashboard → Worker
#   → Settings → Domains & Routes. Niet hier toevoegen als route/pattern, anders
#   loop je het risico dat het botst met de koppeling die er al staat.

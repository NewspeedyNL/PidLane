# ═══════════════════════════════════════════════════════════════════════
# wrangler.toml — Cloudflare Worker "pidlane-proxy"
# ───────────────────────────────────────────────────────────────────────
# Twee deploy-routes, allebei geldig:
#   1. git push naar `main` → Cloudflare Workers Builds bouwt en deployt
#      automatisch, meteen op 100% van het verkeer. Een push naar een BRANCH
#      bouwt wel maar deployt niet; de "Deployment successful" die de
#      Cloudflare-bot dan onder je PR zet is een bouwstatus en geen live
#      versie. Nagemeten op 28-08-2026, zie issue #35. Deze regel zei eerder
#      alleen "git push" zonder branch te noemen, en dat was het misverstand.
#   2. npm run deploy → lokaal via wrangler (nu je node op deze PC hebt)
#
# Ze bijten elkaar niet, maar draai ze niet door elkaar heen: een lokale
# deploy overschrijft wat de laatste git-build heeft neergezet. Houd één
# route aan als "de waarheid" — bij voorkeur git — en gebruik lokaal
# wrangler vooral voor `dev`, `tail` en `secret put`.
#
# Zie SETUP-WRANGLER.md voor de commando's.
# ═══════════════════════════════════════════════════════════════════════

name = "pidlane-proxy"
main = "worker.js"
compatibility_date = "2026-07-24"

# ── Statische app-bestanden ────────────────────────────────────────────
# index.html, pidlane-*.js, pidlane.css, admin.html staan in ./public/.
[assets]
directory = "./public/"
binding = "ASSETS"

# LET OP — dit is de belangrijkste lijst in dit bestand.
# Alles wat hier NIET in staat wordt rechtstreeks als bestand geserveerd en
# raakt worker.js nooit. Voeg je een endpoint toe aan worker.js maar vergeet
# je het hier, dan krijg je een 404 die eruitziet als een routingfout in de
# Worker terwijl de Worker simpelweg niet is aangeroepen.
run_worker_first = [
  "/auth/*",
  "/v1/*",
  "/copilot",
  "/airtable/*",
  "/session/*",
  "/pair/*",
  "/code/*",
  "/klant/*",      # klantaccounts: registreren, inloggen, saldo, wachtwoordherstel
  "/credits/*",    # activatiecodes inwisselen
  "/proxy",
  "/api/*",
  "/admin/*",
  "/download/*",
  "/version.json",
  "/health"
]

# ── Dagelijkse opruimronde ─────────────────────────────────────────────
# Roept scheduled() in worker.js aan. Die wist klantaccounts die de gebruiker
# zelf heeft laten verwijderen en waarvan de bewaartermijn van 30 dagen om is
# (KLANT_BEWAARDAGEN in worker.js). Zonder deze regel blijft de belofte in
# privacy.html — "wij verwijderen binnen 30 dagen" — afhankelijk van iemand
# die eraan denkt.
#
# 03:00 UTC: buiten de spits, en het maakt niet uit of het een uur later wordt.
# Cloudflare garandeert het tijdstip niet precies, alleen dat hij draait.
#
# Handmatig uitproberen kan zonder te wachten:
#   npx wrangler dev --test-scheduled   →  curl "http://localhost:8787/__scheduled"
[triggers]
crons = ["0 3 * * *"]

# ── R2-bucket voor de APK en version.json ──────────────────────────────
# Aangesproken als env.FILES (handleApkDownload, handleVersionJson).
# Bestaat de bucket nog niet: wrangler r2 bucket create pidlane-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "pidlane-files"

# ── D1 voor de logregels ───────────────────────────────────────────────
# Aangesproken als env.LOGDB (handleAirtableLog). Het schema staat in
# schema.sql en wordt bewaakt door public/test-logschema.js.
#
# WAAROM DIT ER IS (#262, #260). De logtabel stond in Airtable, en die base
# liep op 22-09-2026 vol: 1.159 van de 1.000 rijen. Een volle base neemt geen
# nieuwe rijen meer aan, en in diezelfde base staat de Meetopdracht-tabel —
# dus zowel het wegschrijven van een rit als de opdracht voor de volgende rit
# lag stil. Een logtabel die aan een rijenlimiet hangt is de verkeerde
# bewaarplaats voor iets dat per rit honderden regels schrijft.
#
# LET OP BIJ EEN NIEUWE OMGEVING: deze database moet bestaan vóór de eerste
# deploy, anders faalt de build. Aanmaken kan in het dashboard of met
# `wrangler d1 create pidlane_log_db`; daarna het schema uit schema.sql
# draaien.
[[d1_databases]]
binding = "LOGDB"
database_name = "pidlane_log_db"
database_id = "aadad51d-893b-40b6-bfb7-dcee9ca6f80c"

# ── Durable Object voor remote-sessies ─────────────────────────────────
# Aangesproken als env.REMOTE_SESSION; de class zit in worker.js.
# Wordt ook gebruikt door rateLimit() — zonder deze binding valt die terug
# op geheugen per isolate, wat per instantie telt in plaats van globaal.
[[durable_objects.bindings]]
name = "REMOTE_SESSION"
class_name = "RemoteSessionDO"

[exports.RemoteSessionDO]
type = "durable-object"
storage = "sqlite"

# ── Logs ───────────────────────────────────────────────────────────────
# Zet Workers Logs aan, zodat je fouten in de nieuwe klant-endpoints kunt
# terugzien in het dashboard en met `npm run tail` live kunt meekijken.
[observability]
enabled = true
head_sampling_rate = 1

# ── Vars (geen geheimen) ───────────────────────────────────────────────
# Alles hieronder heeft een werkende fallback in worker.js. Alleen invullen
# als je de standaard wilt overschrijven.
#
# [vars]
# LOG_BEWAARDAGEN       = "60"      # zie hieronder — standaard uit
# ALLOW_LEGACY_APP_TOKEN = "false"   # oude APP_TOKEN accepteren — laat uit
# TOKEN_TTL_HOURS        = "12"      # geldigheid sessietoken
# PBKDF2_ITERS           = "100000"  # LET OP: Workers staat niet meer dan 100000 toe
# KLANT_START_SALDO      = "20"      # proeftegoed bij registratie; standaard al 20 in de code
# APP_BASE_URL           = "https://app.pidlane.nl"   # basis voor de herstellink
# MAIL_API_URL           = "https://api.resend.com/emails"  # andere mailprovider
#
# LOG_BEWAARDAGEN — de nachtelijke opruimronde van de logtabel (#260).
# STAAT STANDAARD UIT, en dat is een besluit en geen vergetelheid: een ronde
# die elke nacht rijen weggooit hoort aangezet te worden door een mens. Zonder
# deze var meldt de cron dat hij niets doet; mét een getal wist hij logregels
# die ouder zijn dan zoveel dagen. Regels met een Outcome blijven áltijd
# staan — dat is het antwoord op een issue, en daar is een rit voor gereden.

# ── Secrets — NOOIT in dit bestand ─────────────────────────────────────
# Zet ze met `wrangler secret put NAAM` of via het dashboard onder
# Settings → Variables and Secrets → type "Secret".
#
#   BESTAAND
#     AIRTABLE_TOKEN      lees/schrijf op de Airtable-bases
#     ADMIN_TOKEN         beheerderstoegang (admin.html, noodklep klantwachtwoord)
#     SESSION_SECRET      ondertekent alle sessietokens
#     USERS_JSON          nood-admin buiten Airtable om
#     ANTHROPIC_API_KEY   AI-calls via de AI Gateway
#
#   NIEUW — nodig voor wachtwoordherstel per mail
#     MAIL_API_KEY        sleutel van je mailprovider (bv. Resend)
#     MAIL_FROM           afzender, bv. noreply@pidlane.nl
#
# Zonder MAIL_API_KEY en MAIL_FROM antwoordt /klant/reset-aanvraag met
# "mail_not_configured". Registreren en inloggen werken dan gewoon; alleen
# wachtwoord-vergeten loopt dan via /klant/admin-wachtwoord.

# ── Custom domain ──────────────────────────────────────────────────────
# app.pidlane.nl hangt via Dashboard → Worker → Settings → Domains & Routes
# aan deze Worker. Bewust NIET als route hier: dat botst met de bestaande
# koppeling en kan het domein tijdelijk offline halen.
